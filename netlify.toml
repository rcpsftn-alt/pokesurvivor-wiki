# PokéSurvivor Wiki : site statique, aucune étape de build côté Netlify.
# Pour régénérer docs/index.html en local : python3 build.py
[build]
  publish = "docs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
